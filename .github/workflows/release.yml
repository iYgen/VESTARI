# Сборка и публикация обновления.
# Как выпустить версию:  git tag v0.2.0 && git push origin v0.2.0
# Через несколько минут в Releases появится vestari-0.2.0.apk, и приложение предложит обновиться.
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Версия из тега
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_B64: ${{ secrets.VESTARI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Нет секрета VESTARI_KEYSTORE_BASE64" >&2; exit 1; fi
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 -d > signing/vestari-release.jks

      - name: Тесты и сборка
        env:
          VESTARI_KEYSTORE: signing/vestari-release.jks
          VESTARI_KEYSTORE_PASSWORD: ${{ secrets.VESTARI_KEYSTORE_PASSWORD }}
          VESTARI_KEY_ALIAS: vestari
          VESTARI_KEY_PASSWORD: ${{ secrets.VESTARI_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" \
            -Pvestari.updateRepo="$GITHUB_REPOSITORY"
          cp app/build/outputs/apk/release/app-release.apk "vestari-$VERSION.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: vestari-${{ env.VERSION }}.apk
          generate_release_notes: true
